<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Formularz</title>
  <link rel="stylesheet" href="formularzWalidowany.css">
  <script src="Walidacja.js"></script>
</head>
<body bgcolor="cc9966">
<h1> Formularz do wypełnienia</h1>
  <form action="jakas-strona.com" target="_self">
    <div>
      <!--Początek pierwszego wiersza formularza-->
      <div class="uklad"> <!-- Pierszy element -->
        <label>Imię: <input type="text" required placeholder="Jan" oninput="Imie(this,this.value)"></label>
      </div>
      <div class="uklad"> <!-- Drugi element -->
        <label> Nazwisko: <input type="text" required placeholder="Kowalski" oninput="Nazwisko(this,this.value)" ></label>
      </div>
      <div class="uklad"> <!-- Trzeci element -->
      <label> Płeć:
      <select required>
        <option value="None" >Wybierz</option>
        <option value="Male" style="background-color: #00adb6"> Mężczyzna </option>
        <option value="Female" style="background-color: #ff57b2">Kobieta</option>
      </select></label>
      </div>
    </div>
    <!--Początek drugiego wiersza-->
    <div>
      <p><br/></p>
      <div class="uklad"> <!-- Pierwszy element-->
        <label>Państwo: <input type="text" required placeholder="Polska" onblur="Panstwo(this.value)"></label>
      </div>
      <div class="uklad"><!-- Drugi element-->
        <label> Miasto:<input type="text" required placeholder="Warszawa" onblur="Miasto(this.value)"></label>
      </div>
    </div>
    <!-- Początek trzeciego wiersza-->
    <div>
      <p><br/></p>
      <div class="uklad">
        <label> Ulica:<input type="text" required placeholder="Armii Krajowej"></label>
      </div>
      <div class="uklad">
        <label> Numer domu:<input type="text" size="5" required placeholder="1" style="width: 15%" maxlength="5" oninput="NumerDomu(this,this.value)"></label>
      </div>
      <div class="uklad">
        <label> Numer mieszkania:<input type="number" size="4" style="width: 15%" min="1" max="999" onblur="NumerMieszkania(this.value)"></label>
      </div>
    </div>
    <!-- Początek czwartego wiersza-->
    <div>
      <div class="uklad" style="width: 40%">
        <label> Numer telefonu: <input type="tel" maxlength="15" required placeholder="333 333 333" onblur="NumerTelefonu(this, this.value)"></label>
      </div>
      <div class="uklad">
        <label> Data urodzenia:<input type="date" required onblur="Data(this.value)"></label>
      </div>
    </div>
    <!-- Początek piątego wiersza-->
    <div>
      <div class="uklad">
      <label> Czy posiadasz prawo jazdy:
      <input type="checkbox" value="True"> Tak</label>
      </div>
    </div>
    <!-- Początek szóstego wiersza-->
    <div>
        <p><br/><br><br></p>
        <label> Hasło:<input type="password" required></label>
    </div>
    <div>
      <div>
        <button>Wyślij</button>
      </div>
    </div>
  </form>
</body>
</html>
