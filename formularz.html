<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Formularz</title>
    <style>
        div{
            margin: auto;
            font-size:18px;
            font-family:MV Boli;
            text-shadow: 3px 3px 4px
        }
    </style>
</head>
<body bgcolor="cc9966">
<h1 style="text-align:center"> Formularz do wypełnienia</h1>
<div>
  <form action="jakas-strona.com" target="_self">
      <label>Imię:</label><input type="text" required><br/>
      <label> Nazwisko:</label> <input type="text" required><br/>
      <label> Płeć:</label>
      <select required>
          <option value="None"></option>
          <option value="Male"> Mężczyzna </option>
          <option value="Female">Kobieta</option>
          <option value="Joke">Helikopter bojowy</option>
      </select><br/>
      <label>Państwo: </label><input type="text" required>
      <label> Miasto:</label> <input type="text" required><br/>
      <label> Ulica:</label> <input type="text" required>
      <label> Numer domu:</label> <input type="number" size="5" required>
      <label> Numer mieszkania (Opcjonalnie):</label> <input type="number" size="4"><br/>
      <label> Numer telefonu:</label> <input type="tel" maxlength="15" required><br/>
      <label> Data urodzenia:</label> <input type="date" required><br/>
      <label> Czy posiadasz prawo jazdy:</label>
      <select required>
          <option value="None"></option>
          <option value="True"> Tak </option>
          <option value="False">Nie</option>
      </select><br/>
      <label> Hasło:</label> <input type="password" required><br/>
      <label>Zatwierdź</label> <input type="submit">

  </form>
</div>
</body>
</html>
