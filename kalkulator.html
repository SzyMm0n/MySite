<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kalkulator</title>
    <style>
        div{
            align-items: center;
            text-align: center;
            max-width: 100%;
            height: 100%;
            margin-left: auto;
            margin-right: auto;
            background-color: darkolivegreen;
        }
        .przyciski{
                width: 25%;
                height: auto;
                border:2px solid black;
                float: left;
                border-radius: 20px;
                padding: 15px;

        }
    </style>
</head>
<body>
<div>
    <div class="przyciski">1</div>
    <div class="przyciski">2</div>
    <div class="przyciski">3</div>
    <div class="przyciski" style="width: 10%">+</div>
</div>
<div>
    <div class="przyciski">4</div>
    <div class="przyciski">5</div>
    <div class="przyciski">6</div>
    <div class="przyciski" style="width: 10%">-</div>
</div>
<div>
    <div class="przyciski">7</div>
    <div class="przyciski">8</div>
    <div class="przyciski">9</div>
    <div class="przyciski" style="width: 10%">x</div>
</div>
</body>
</html>
