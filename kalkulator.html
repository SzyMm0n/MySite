<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kalkulator</title>
    <style>
        div{
            align-items: center;
            text-align: center;
            max-width: 100%;
            height: 100%;
            margin:auto;
        }
        .przyciski{
                width: 25%;
                height: auto;
                float: left;
        }
        button{
            width: 100%;
            height: 100%;
            background-color: #50ffce;
            padding: 20px;
            border-radius: 25px;
            font-size: 150%;
        }
        input{
            width: 90%;
            height: 20px;
            padding: 10px;
            border-radius: 25px;
            font-size: 150%;
        }
    </style>
</head>
<body>
<div>
    <input >
</div>
<div>
    <div class="przyciski"><button>1</button></div>
    <div class="przyciski"><button>2</button></div>
    <div class="przyciski"><button>3</button></div>
    <div class="przyciski" ><button>+</button></div>
</div>
<div>
    <div class="przyciski"><button>4</button></div>
    <div class="przyciski"><button>5</button></div>
    <div class="przyciski"><button>6</button></div>
    <div class="przyciski"><button>-</button></div>
</div>
<div>
    <div class="przyciski"><button>7</button></div>
    <div class="przyciski"><button>8</button></div>
    <div class="przyciski"><button>9</button></div>
    <div class="przyciski"><button>x</button></div>
</div>
<div>
    <div class="przyciski"><button>0</button></div>
    <div class="przyciski" style="width: 50%"><button>=</button></div>
    <div class="przyciski"><button>/</button></div>
</div>
</body>
</html>
